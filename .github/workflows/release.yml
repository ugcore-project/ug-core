name: Release

# On main, release-please keeps a release PR open that bumps the manifest version and CHANGELOG.md
# from Conventional Commits. Merging it tags vX.Y.Z and creates the GitHub release; this workflow then
# attaches the archive owners install.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release-please:
    name: Release PR and tag
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Reads release-please-config.json and .release-please-manifest.json.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  package:
    name: Archive
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Install Lua 5.4
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4

      # release-please bumped the manifest in the release PR: a mismatch means the config lost track of it.
      - name: Check the version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if ! grep -q "^version '${VERSION}'" fxmanifest.lua; then
            echo "::error::fxmanifest.lua does not say version '${VERSION}'. Check extra-files in release-please-config.json."
            exit 1
          fi

      - name: Package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: bash .github/scripts/package.sh "$VERSION" "$RUNNER_TEMP/dist"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          gh release upload "$TAG" \
            "$RUNNER_TEMP/dist/ug-core-${VERSION}.zip" \
            "$RUNNER_TEMP/dist/ug-core-${VERSION}.zip.sha256" \
            --clobber
