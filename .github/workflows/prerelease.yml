name: Dev build

# Every push to dev that passes CI replaces one rolling pre-release, tagged dev-build.
# The update check reads /releases/latest, which never returns a pre-release, so servers on a
# stable release are never told about dev builds.

on:
  push:
    branches: [dev]

permissions: {}

concurrency:
  group: prerelease
  cancel-in-progress: true

env:
  # Not `dev`: a tag named like the branch makes `git checkout dev` ambiguous.
  TAG: dev-build

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Archive
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes list commits since the last release tag.
          fetch-depth: 0

      - name: Install Lua 5.4
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4

      # Build metadata keeps the release it builds on: 1.2.0+dev.42.abc1234. Version checks ignore it.
      - name: Version
        id: version
        run: |
          base=$(sed -n "s/^version '\([0-9]*\.[0-9]*\.[0-9]*\)'.*/\1/p" fxmanifest.lua)

          if [ -z "$base" ]; then
            echo "::error::No MAJOR.MINOR.PATCH version in fxmanifest.lua."
            exit 1
          fi

          echo "value=${base}+dev.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # One stable asset name, so the download link of the dev build never changes.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCHIVE: ug-core-dev.zip
        run: bash .github/scripts/package.sh "$VERSION" "$RUNNER_TEMP/dist"

      # Commit subjects are written to a file, never into the script, so they cannot run as shell.
      - name: Notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range=${last:+${last}..}HEAD

          {
            echo "Development build ${VERSION} of \`dev\`. It MAY break: run releases on production servers."
            echo
            echo "Changes since ${last:-the first commit}:"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range" | head -n 100
          } > "$RUNNER_TEMP/notes.md"

      - name: Replace the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true

          gh release create "$TAG" \
            "$RUNNER_TEMP/dist/ug-core-dev.zip" \
            "$RUNNER_TEMP/dist/ug-core-dev.zip.sha256" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Dev build ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
